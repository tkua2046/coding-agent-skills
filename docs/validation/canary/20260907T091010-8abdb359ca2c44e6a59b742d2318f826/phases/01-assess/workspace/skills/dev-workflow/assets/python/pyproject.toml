# Example for a standard-library app.py with tests/. Adapt source paths first.
[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov --cov-config=pyproject.toml --cov-report=term-missing --cov-report=xml:coverage.xml"

[tool.coverage.run]
source = ["app"]
branch = true
patch = ["subprocess"]

[tool.coverage.report]
show_missing = true
