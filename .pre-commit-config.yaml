minimum_pre_commit_version: "4.6.2"
default_language_version:
  python: python3.12
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
        exclude: ^docs/(reviews/inputs-initial/|validation/)
      - id: end-of-file-fixer
        exclude: ^docs/(reviews/inputs-initial/|validation/)
      - id: check-yaml
      - id: check-toml
      - id: check-merge-conflict
        args: [--assume-in-merge]
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.6
    hooks:
      - id: ruff-check
        exclude: ^docs/(reviews/inputs-initial/|validation/)
        args: [--fix]
      - id: ruff-format
        exclude: ^docs/(reviews/inputs-initial/|validation/)
  - repo: local
    hooks:
      - id: skill-bundles
        name: Skill bundle and documentation validation
        entry: python tools/check.py
        language: python
        additional_dependencies: [PyYAML==6.0.3, markdown-it-py==4.0.0]
        pass_filenames: false
        always_run: true
      - id: tests-with-coverage
        name: Repository tests with coverage
        entry: python -m pytest
        language: python
        additional_dependencies: [pytest==9.1.1, pytest-cov==7.1.0, coverage==7.16.0, PyYAML==6.0.3, markdown-it-py==4.0.0]
        pass_filenames: false
        always_run: true
        require_serial: true
        verbose: true
